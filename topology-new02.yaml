topology:
  orbital-plane: 2
  sat-orbital-plane: 2

node-types:
  - type: Any
    interfaces: []
    properties:
      image: "generic-node.img"

  - type: Satellite
    inherits: Any
    interfaces:
      - connects-to: Satellite
      - connects-to: Terminal
      - connects-to: Gateway
    properties:
      image: "satellite.img"

  - type: SatelliteBig
    inherits: Satellite
    properties:
      max-terminals: 200
      max-gateways: 4
      image: "satellite-big.img"

  - type: SatelliteSmall
    inherits: Satellite
    properties:
      max-terminals: 30
      max-gateways: 2
      image: "satellite-small.img"

  - type: Terminal
    inherits: Any
    interfaces:
      - connects-to: Satellite
    properties:
      image: "terminal.img"

  - type: Gateway
    inherits: Any
    interfaces:
      - connects-to: Satellite
      - connects-to: Router
    properties:
      image: "gateway.img"

  - type: Router
    inherits: Any
    interfaces:
      - connects-to: Gateway
      - connects-to: Router
    properties:
      image: "router.img"

nodes:
  - id: 0
    type: SatelliteBig
    latitude: 40.5
    longitude: 100.0
    altitude: 550000
    orbital-plane: 0
    interfaces: 
      - id: 0
        type: to_satellite
      - id : 1
        type: to_gateway
      - id: 2
        type: to_router

  - id: 1
    type: SatelliteSmall
    latitude: 40.5
    longitude: 100.0
    altitude: 550000
    orbital-plane: 0
  - id: 2
    type: SatelliteSmall
    latitude: 40.5
    longitude: 100.0
    altitude: 550000
    orbital-plane: 1
  - id: 3
    type: SatelliteBig
    latitude: 40.5
    longitude: 100.0
    altitude: 550000
    orbital-plane: 1
  - id: 4
    type: Terminal
    latitude: 40.5
    longitude: 100.0
    altitude: 0
    orbital-plane: 0
  - id: 5
    type: Gateway
    latitude: 40.5
    longitude: 100.0
    altitude: 0
    orbital-plane: 0
  - id: 6
    type: Router
    latitude: 40.5
    longitude: 100.0
    altitude: 0
    orbital-plane: 0

