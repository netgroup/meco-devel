topology:
  orbital-plane: 1
  sat-orbital-plane: 1

node-types:
  Any:
    interfaces: []
    properties:
      image: "generic-node.img"

  Satellite:
    inherits: Any
    interfaces:
      - connects-to: Satellite
      - connects-to: GroundStation
      - connects-to: Terminal
    properties:
      image: "satellite.img"

  Terminal:
    inherits: Any
    interfaces:
      - connects-to: Satellite
    properties:
      image: "terminal.img"

  GroundStation:
    inherits: Any
    interfaces:
      - connects-to: Satellite
      - connects-to: Terminal
    properties:
      image: "groundstation.img"

nodes:
  - id: 1
    type: Satellite
    latitude: 40.5
    longitude: 100
    altitude: 550000
    orbital-plane: 0
  - id: 2
    type: Terminal
    latitude: 40.5
    longitude: 100
    altitude: 0
  - id: 3
    type: Terminal
    latitude: 40.5
    longitude: 100
    altitude: 0
  - id: 4
    type: Terminal
    latitude: 40.5
    longitude: 100
    altitude: 0
  - id: 5
    type: Terminal
    latitude: 40.5
    longitude: 100
    altitude: 0

visibility-ground:
  - time: 0
    connection:
      - source: 1
        destination: 2
        delay: 30
        loss: 0
        bandwidth: 40
      - source: 1
        destination: 3
        delay: 30
        loss: 0
        bandwidth: 40
      - source: 1
        destination: 4
        delay: 30
        loss: 0
        bandwidth: 40
